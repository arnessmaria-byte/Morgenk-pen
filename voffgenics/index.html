<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Voffgenics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: kennelens oppslagstavle med stamtavlekort på kraftpapir; kampen er en inngjerdet bakgård sett ovenfra. Én bevisst lys verden. */
:root {
  color-scheme: light;
  --kraft: #c99c66;
  --kraft-2: #b4834c;
  --paper: #f7ecd6;
  --paper-2: #eadab7;
  --ink: #24180d;
  --ink-2: #5e4630;
  --rosette: #2a52be;
  --danger: #c3362b;
  --heal: #2e8745;
  --gold: #e2a524;
  --lawn: #7aa446;
  --lawn-2: #6f9a3e;
  --fence: #7d4f2a;
  --on-dark: #fff8ea;
  --c-slass: #c3362b;
  --c-vokt: #2a52be;
  --c-jakt: #2e8745;
  --c-myst: #7b3fb0;
  --c-pleie: #e2a524;
  --font-display: "Bagel Fat One", "Arial Black", Impact, sans-serif;
  --font-body: "Bricolage Grotesque", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --tile: clamp(34px, calc((100vw - 52px) / 8), 66px);
  --shadow: 3px 3px 0 var(--ink);
}
* { box-sizing: border-box; }
body {
  background-color: var(--kraft);
  background-image: radial-gradient(rgba(70, 40, 10, .13) 1px, transparent 1.5px), radial-gradient(rgba(255, 244, 220, .16) 1px, transparent 1.5px);
  background-size: 7px 7px, 11px 11px;
  background-position: 0 0, 3px 5px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  margin: 0;
  overflow-x: hidden;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }

.top, .wrap, .battle { max-width: 1180px; margin: 0 auto; padding-inline: 16px; }
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 16px; padding-block: 14px 6px; }
.logo {
  font-family: var(--font-display); font-weight: 400; font-size: clamp(30px, 7vw, 48px); line-height: .95;
  color: var(--paper); -webkit-text-stroke: 2.5px var(--ink); paint-order: stroke fill; text-shadow: 3px 3px 0 var(--ink);
  letter-spacing: .01em;
}
.tagline { font-weight: 600; color: var(--ink-2); font-size: 13px; margin-top: 4px; }
.meters { display: flex; flex-wrap: wrap; gap: 8px; }
.meter {
  background: var(--paper); border: 2px solid var(--ink); border-radius: 999px; padding: 4px 12px;
  font-weight: 800; box-shadow: 2px 2px 0 var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap;
}
.wrap { padding-block: 12px 48px; display: flex; flex-direction: column; gap: 22px; }
.wrap.narrow { max-width: 760px; }
.top.narrow { max-width: 760px; }

.btn {
  font: 800 15px/1.1 var(--font-body); background: var(--rosette); color: var(--on-dark); border: 2px solid var(--ink);
  border-radius: 10px; padding: 11px 16px; box-shadow: var(--shadow); cursor: pointer;
  transition: transform .08s, box-shadow .08s;
}
.btn:hover:not(:disabled) { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
.btn:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: var(--paper); color: var(--ink); }
.btn.warn { background: var(--danger); }
.btn.go { background: var(--heal); }
.btn.small { padding: 6px 10px; font-size: 13px; box-shadow: 2px 2px 0 var(--ink); border-radius: 8px; }
.btn.big { font-size: 17px; padding: 13px 20px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

.eyebrow { font: 600 12px/1.2 var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); }
.screen-title { font-family: var(--font-display); font-weight: 400; font-size: clamp(28px, 5vw, 40px); line-height: 1.05; }
h2.sec { font-family: var(--font-display); font-weight: 400; font-size: 26px; line-height: 1.1; }
.sec-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; margin-bottom: 12px; }
.muted { color: var(--ink-2); }
.mono { font-family: var(--font-mono); font-size: 12px; font-variant-numeric: tabular-nums; }

.panel { background: var(--paper); border: 2px solid var(--ink); border-radius: 8px; box-shadow: var(--shadow); padding: 14px; min-width: 0; }
.panel h3 { font-size: 16px; font-weight: 800; }
.news ul { margin: 6px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; }
.intro { display: grid; gap: 10px; }
.intro ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; max-width: 70ch; }

.pill {
  display: inline-block; font: 800 10.5px/1.5 var(--font-body); text-transform: uppercase; letter-spacing: .07em;
  border: 1.5px solid var(--ink); border-radius: 4px; padding: 0 6px; background: var(--paper); white-space: nowrap;
}
.pill.klar { background: #bfe0b4; }
.pill.valp { background: #f6dc8b; }
.pill.veteran { background: var(--ink); color: var(--paper); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip {
  font: 700 12px/1.2 var(--font-body); border: 1.5px solid var(--ink); border-radius: 999px; padding: 3px 9px;
  background: #fffaf0; cursor: help;
}
.chip.mut { background: #dbe4fb; }
.chip.bad { background: #f6cfc8; }
.chip.abil { background: #fbe9b4; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 272px), 1fr)); gap: 16px; }
.dog { background: var(--paper); border: 2px solid var(--ink); border-radius: 8px; box-shadow: var(--shadow); padding: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.dog.veteran { background: var(--paper-2); }
.dog.dim { opacity: .5; }
.dog.cand { outline: 3px dashed var(--rosette); outline-offset: 3px; }
.dog-head { display: flex; gap: 12px; align-items: center; }
.pic {
  width: 84px; height: 84px; flex: none; border: 2px solid var(--ink); border-radius: 50%; overflow: hidden;
  background: radial-gradient(circle at 50% 40%, #fff9ee 0, var(--paper-2) 70%);
}
.pic.big { width: 120px; height: 120px; }
.pic.sm { width: 52px; height: 52px; border-width: 1.5px; }
.portrait { width: 100%; height: 100%; display: block; }
.dog h3 { font-size: 19px; font-weight: 800; line-height: 1.1; }
.sex { font-weight: 800; color: var(--ink-2); }
.reg { font: 500 11.5px var(--font-mono); color: var(--ink-2); letter-spacing: .02em; }
.id { min-width: 0; display: grid; gap: 4px; }
.stats { display: grid; gap: 3px; }
.stat { display: grid; grid-template-columns: 34px 1fr 20px; align-items: center; gap: 6px; font: 600 11.5px var(--font-mono); cursor: help; }
.stat .v { text-align: right; font-variant-numeric: tabular-nums; }
.pips { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; }
.pips i { height: 8px; border: 1.5px solid var(--ink); border-radius: 2px; }
.pips i.on { background: var(--ink-2); }
.pips i.plus { background: var(--rosette); }
.pips i.minus { background: repeating-linear-gradient(45deg, var(--danger) 0 2px, transparent 2px 4px); }
.lineage { font-size: 12.5px; color: var(--ink-2); }
.derived { font: 500 11.5px var(--font-mono); color: var(--ink-2); }
.card-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; }
.warnline { font-size: 12.5px; font-weight: 700; }
.warnline.naer { color: var(--danger); }
.warnline.fjern { color: #9a5b00; }

.pairs { display: flex; flex-wrap: wrap; gap: 12px; }
.pair { display: flex; align-items: center; gap: 8px; background: #fffaf0; border: 2px solid var(--ink); border-radius: 999px; padding: 4px 6px 4px 4px; flex-wrap: wrap; }
.pair .heart { font-family: var(--font-display); color: var(--danger); font-size: 18px; }
.banner { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--rosette); color: var(--on-dark); border: 2px solid var(--ink); border-radius: 8px; padding: 10px 14px; box-shadow: var(--shadow); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; font-weight: 700; }

details.fold summary { cursor: pointer; font-weight: 800; }
.grave { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 4px; font-size: 13.5px; }

/* Oppsett av tur */
.picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.pick { background: var(--paper); border: 2px solid var(--ink); border-radius: 8px; box-shadow: var(--shadow); padding: 10px; display: grid; gap: 10px; min-width: 0; }
.pick.on { background: #dfe7fb; }
.pick-top { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; }
.pick-top .mono { display: block; margin-top: 3px; }
.check { margin-left: auto; width: 26px; height: 26px; border: 2px solid var(--ink); border-radius: 6px; background: var(--paper); display: grid; place-items: center; font-weight: 800; flex: none; }
.pick.on .check { background: var(--rosette); color: var(--on-dark); }
.clsrow { display: flex; flex-wrap: wrap; gap: 6px; }
.cls-btn { border: 2px solid var(--ink); background: var(--paper); border-radius: 999px; padding: 4px 10px 4px 6px; font-weight: 700; font-size: 13px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.cls-btn::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--cc); border: 1.5px solid var(--ink); }
.cls-btn.on { background: var(--cc); color: var(--on-dark); }
.cls-btn.on::before { background: var(--paper); }
.legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 10px; }
.legend div { border-left: 6px solid var(--cc); padding-left: 10px; font-size: 13.5px; }
.legend b { display: block; }
.sticky-bar { position: sticky; bottom: env(safe-area-inset-bottom, 0px); background: var(--paper); border: 2px solid var(--ink); border-radius: 10px; box-shadow: var(--shadow); padding: 10px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: center; z-index: 10; }

/* Turløypa */
.party { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 10px; }
.pm { display: flex; gap: 10px; align-items: center; background: var(--paper); border: 2px solid var(--ink); border-radius: 8px; padding: 8px; box-shadow: 2px 2px 0 var(--ink); min-width: 0; }
.pm.dead { opacity: .45; }
.pm .nm { font-weight: 800; }
.bar { height: 9px; border: 1.5px solid var(--ink); border-radius: 4px; background: #fff6; overflow: hidden; margin-top: 4px; }
.bar i { display: block; height: 100%; background: var(--heal); }
.route { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.step { display: grid; grid-template-columns: 70px 1fr; gap: 10px; align-items: center; }
.step-label { font: 600 12px var(--font-mono); text-transform: uppercase; letter-spacing: .06em; }
.nodes { display: flex; flex-wrap: wrap; gap: 10px; }
.node { flex: 1 1 200px; display: flex; gap: 10px; align-items: center; text-align: left; background: var(--paper); border: 2px solid var(--ink); border-radius: 10px; padding: 10px 12px; min-width: 0; }
button.node { cursor: pointer; box-shadow: var(--shadow); transition: transform .08s, box-shadow .08s; }
button.node:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
.node.future { border-style: dashed; background: transparent; opacity: .75; }
.node.past { opacity: .4; background: transparent; }
.node.chosen { opacity: 1; background: var(--paper-2); }
.node b { display: block; }
.node small { display: block; color: var(--ink-2); font-size: 12.5px; }
.ico { width: 36px; height: 36px; flex: none; }

/* Hendelse og nivå */
.story { display: grid; gap: 14px; }
.story .lead { font-size: 18px; max-width: 60ch; }
.result { font-size: 17px; font-weight: 600; background: #fffaf0; border: 2px dashed var(--ink); border-radius: 8px; padding: 12px; }
.lvl { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.offers { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 12px; }
.offer { text-align: left; display: grid; gap: 6px; align-content: start; background: var(--paper); border: 2px solid var(--ink); border-radius: 10px; padding: 14px; cursor: pointer; box-shadow: var(--shadow); }
.offer:hover { background: #fff6dc; }
.offer b { font-size: 18px; }
.offer small { color: var(--ink-2); font-size: 13px; }
.offer .pill { justify-self: start; }
.res { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.res .dead { color: var(--danger); }

/* Kamp */
.battle { padding-block: 10px 40px; display: flex; flex-direction: column; gap: 12px; }
.bt-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 8px; }
.bt-top h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(24px, 4.5vw, 34px); line-height: 1.05; }
.bt-main { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
.board-wrap { flex: none; padding: 6px; background: repeating-linear-gradient(90deg, #8a5a32 0 11px, #6c4322 11px 13px); border: 2px solid var(--ink); border-radius: 6px; box-shadow: var(--shadow); max-width: 100%; }
.board { position: relative; display: grid; grid-template-columns: repeat(8, var(--tile)); grid-template-rows: repeat(6, var(--tile)); }
.tile { appearance: none; border: 0; margin: 0; padding: 0; width: var(--tile); height: var(--tile); background: var(--lawn); position: relative; cursor: pointer; display: block; }
.tile.alt { background: var(--lawn-2); }
.tile svg { position: absolute; inset: 7%; width: 86%; height: 86%; }
.tile.hl-move::after { content: ""; position: absolute; inset: 3px; border-radius: 7px; background: rgba(255, 252, 235, .42); border: 2px dashed rgba(36, 24, 13, .55); }
.tile.hl-tgt::after { content: ""; position: absolute; inset: 2px; border-radius: 50%; border: 3px solid var(--danger); background: rgba(195, 54, 43, .2); }
.tile.hl-ally::after { content: ""; position: absolute; inset: 2px; border-radius: 50%; border: 3px solid var(--heal); background: rgba(46, 135, 69, .22); }
.tile.hl-area::after { content: ""; position: absolute; inset: 1px; border-radius: 4px; border: 2px dotted rgba(123, 63, 176, .9); }
.tile.hl-aoe::before { content: ""; position: absolute; inset: 0; background: rgba(123, 63, 176, .42); }
.units, .fxl { position: absolute; inset: 0; pointer-events: none; }
.unit { position: absolute; left: 0; top: 0; width: var(--tile); height: var(--tile); transform: translate(calc(var(--x) * var(--tile)), calc(var(--y) * var(--tile))); transition: transform .09s linear; }
.unit::after { content: ""; position: absolute; left: 14%; right: 14%; bottom: 9%; height: 16%; border-radius: 50%; background: var(--ring, var(--ink)); opacity: .6; z-index: -1; }
.u-pic { position: absolute; inset: 3% 5% 15% 5%; transition: transform .2s, filter .2s; }
.u-hp { position: absolute; left: 12%; right: 12%; bottom: 4%; height: 7px; background: rgba(36, 24, 13, .45); border: 1.5px solid var(--ink); border-radius: 3px; overflow: hidden; }
.u-hp i { display: block; height: 100%; background: #6fd36a; }
.unit.foe .u-hp i { background: #ff6a55; }
.unit.sel::before { content: ""; position: absolute; inset: 1px; border: 3px solid var(--gold); border-radius: 50%; animation: pulse 1s ease-in-out infinite alternate; }
.unit.done .u-pic { filter: saturate(.3) brightness(.92); }
.unit.down .u-pic { transform: rotate(90deg) scale(.85); filter: grayscale(1) opacity(.7); }
.unit.dead { animation: poof .45s forwards; }
.unit.hit .u-pic { animation: shake .3s; }
.badges { position: absolute; top: 0; right: 0; display: flex; gap: 1px; }
.badge { font: 800 10px/1 var(--font-body); min-width: 15px; height: 15px; border-radius: 8px; border: 1.5px solid var(--ink); display: grid; place-items: center; padding: 0 2px; color: var(--on-dark); }
.badge.sh { background: var(--rosette); }
.badge.po { background: var(--heal); }
.badge.ta { background: var(--gold); color: var(--ink); }
.float { position: absolute; left: 0; top: 0; width: var(--tile); text-align: center; font: 400 19px/1 var(--font-display); color: var(--on-dark); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; transform: translate(calc(var(--x) * var(--tile)), calc(var(--y) * var(--tile))); animation: rise .95s ease-out forwards; }
.float.heal { color: #8cf08a; }
.float.crit { font-size: 25px; color: #ffd23a; }
.float.miss { font-size: 14px; }
.legend-line { font-size: 12.5px; color: var(--ink-2); max-width: calc(var(--tile) * 8 + 12px); }
.bt-side { flex: 1 1 290px; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.sel-head { display: flex; gap: 10px; align-items: center; }
.sub { font-size: 13px; color: var(--ink-2); }
.hint { font-size: 13.5px; margin: 8px 0; }
.acts { display: grid; gap: 6px; }
.act { display: grid; grid-template-columns: 1fr auto; gap: 1px 8px; text-align: left; width: 100%; background: #fffaf0; border: 2px solid var(--ink); border-radius: 8px; padding: 7px 10px; cursor: pointer; }
.act:hover:not(:disabled) { background: #fff1c9; }
.act.on { background: var(--gold); }
.act:disabled { opacity: .42; cursor: not-allowed; }
.act b { font-weight: 800; }
.act .cd { font: 600 11.5px var(--font-mono); align-self: center; }
.act small { grid-column: 1 / -1; font-size: 12.5px; color: var(--ink-2); }
.roster { display: grid; gap: 6px; }
.roster button { display: flex; align-items: center; gap: 8px; text-align: left; border: 2px solid var(--ink); border-radius: 8px; padding: 4px 8px 4px 4px; background: #fffaf0; cursor: pointer; }
.roster .pic.sm { width: 38px; height: 38px; }
.log ol { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 3px; font-size: 13px; }
.log li:first-child { font-weight: 700; }
.endturn { width: 100%; }

.overlay { position: fixed; inset: 0; background: rgba(36, 24, 13, .55); display: grid; place-items: center; padding: 16px; z-index: 50; }
.modal { background: var(--paper); border: 3px solid var(--ink); border-radius: 12px; box-shadow: 6px 6px 0 var(--ink); max-width: 520px; width: 100%; padding: 20px; max-height: 90vh; overflow: auto; display: grid; gap: 12px; }
.modal h2 { font-family: var(--font-display); font-weight: 400; font-size: 30px; line-height: 1.05; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 10px; width: max-content; max-width: calc(100vw - 32px); z-index: 60; font-weight: 600; box-shadow: 3px 3px 0 rgba(0, 0, 0, .25); }

@keyframes pulse { from { transform: scale(.94); } to { transform: scale(1.02); } }
@keyframes rise { from { translate: 0 0; opacity: 1; } to { translate: 0 -30px; opacity: 0; } }
@keyframes poof { to { opacity: 0; scale: .4; } }
@keyframes shake { 0%, 100% { translate: 0 0; } 25% { translate: -3px 0; } 75% { translate: 3px 0; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition: none !important; }
}
@media (max-width: 520px) {
  .step { grid-template-columns: 1fr; gap: 4px; }
  .dog-head .pic { width: 72px; height: 72px; }
}
</style>

<div id="app"></div>
<div id="modal-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script>
(() => {
'use strict';
// ===== 01-core.js =====
// ---------- Tilfeldighet (seedet, så tester kan gjentas) ----------
let rngState = 1;
function seed(n) { rngState = (n >>> 0) || 1; }
function rnd() {
  rngState = (rngState + 0x6D2B79F5) >>> 0;
  let t = rngState;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
const pick = arr => arr[Math.floor(rnd() * arr.length)];
const chance = p => rnd() < p;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
  return arr;
}
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pct = p => Math.round(p * 100) + ' %';
const man = (ax, ay, bx, by) => Math.abs(ax - bx) + Math.abs(ay - by);

// ---------- Regler og data ----------
const CAP = 12;          // plasser i kennelen
const STEPS = 6;         // 5 steg + Kattekongen
const ADOPT_COST = 12;
const KURS_COST = 8;

function newGame(seedVal) {
  seed(seedVal ?? (Date.now() % 2147483647));
  S = { v: 1, day: 1, bones: 20, wins: 0, heat: 0, nextId: 1, dogs: [], reg: {}, grave: [], pairs: [], news: [], screen: 'kennel', run: null, intro: true, bcount: 0 };

  S.news = ['Seks gatehunder har flyttet inn i kennelen. Par dem, eller send dem på tur.'];
  UI.pairing = null; UI.setup = []; UI.sel = null; UI.mode = 'move'; UI.confirm = null;
}
function addDog(d) { S.dogs.push(d); S.reg[d.id] = { name: d.name, mom: d.mom, dad: d.dad, sex: d.sex }; return d; }
function newId() { return 'd' + (S.nextId++); }
function regNo(n, day) { return `VK ${String(n).padStart(4, '0')}/${String(day).padStart(2, '0')}`; }
const dogById = id => S.dogs.find(d => d.id === id);
const roman = i => ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X'][i] || String(i);
function freshName(sex) {
  const list = sex === 'F' ? NAMES_F : NAMES_M;
  const used = new Set(S.dogs.map(d => d.name));
  const free = list.filter(n => !used.has(n));
  if (free.length) return pick(free);
  const base = pick(list); let i = 2;
  while (used.has(`${base} ${roman(i)}`)) i++;
  return `${base} ${roman(i)}`;
}
function randomLook() {
  const fur = ri(0, FURS.length - 1);
  let patc = ri(0, FURS.length - 1); if (patc === fur) patc = (patc + 3) % FURS.length;
  return { fur, patc, pat: pick(PATTERNS), ears: pick(EARS), snout: pick(SNOUTS), eye: ri(0, EYES.length - 1) };
}
function randomMut(pGood, exclude = []) {
  const pool = (chance(pGood) ? GOOD_MUTS : BAD_MUTS).filter(m => !exclude.includes(m));
  return pool.length ? pick(pool) : null;
}
function makeStray(sex) {
  const id = newId(); const n = S.nextId - 1;
  sex = sex || (chance(0.5) ? 'M' : 'F');
  const stats = {}; for (const k of STATS) stats[k] = ri(2, 6);
  const muts = []; if (chance(0.25)) muts.push(randomMut(0.7));
  const learned = []; if (chance(0.2)) learned.push(pick(LEARNED));
  return {
    id, reg: regNo(n, S.day), name: freshName(sex), sex, stats, look: randomLook(), muts, learned,
    level: 1, xp: 0, status: 'voksen', bornDay: S.day, mom: null, dad: null, gen: 0, kurs: false, scars: 0, runs: 0, wins: 0,
  };
}

// ---------- Egenskaper ----------
function eff(d, k) { let v = d.stats[k]; for (const m of d.muts) v += (MUTS[m].mods[k] || 0); return clamp(v, 1, 12); }
function derive(d, cls) {
  const st = k => eff(d, k), has = a => d.learned.includes(a), mut = m => d.muts.includes(m);
  return {
    maxHp: 6 + st('uth') * 2 + (cls ? CLASSES[cls].hp : 0) + (has('tykkpels') ? 4 : 0),
    melee: 1 + Math.ceil(st('sty') / 2) + (has('klor') ? 1 : 0) + (mut('tenner') ? 1 : 0),
    ranged: 1 + Math.floor(st('smi') / 2),
    magic: 1 + Math.floor(st('int') / 2),
    heal: 2 + Math.floor(st('int') / 2),
    selfHeal: 3 + Math.floor(st('int') / 3),
    move: 2 + Math.floor(st('hur') / 3) + (has('poter') ? 1 : 0),
    dodge: Math.min(0.4, st('smi') * 0.03),
    crit: Math.min(0.6, 0.03 + st('fla') * 0.04 + (has('snute') ? 0.1 : 0)),
    save: Math.min(0.95, 0.45 + st('fla') * 0.05 + (has('seig') ? 0.25 : 0)),
    reach: mut('kjempetunge') ? 2 : 1,
    thorns: mut('pigg') ? 1 : 0,
  };
}
function bump(d, k, n) { d.stats[k] = clamp(d.stats[k] + n, 1, 10); }
function addMut(d, m) { if (m && !d.muts.includes(m) && d.muts.length < 3) { d.muts.push(m); return true; } return false; }
function scar(d) {
  const ks = STATS.filter(k => d.stats[k] > 1);
  if (!ks.length) return 'uth';
  const k = pick(ks); d.stats[k]--; d.scars++; return k;
}
function killDog(d, cause) {
  S.dogs = S.dogs.filter(x => x.id !== d.id);
  S.pairs = S.pairs.filter(p => !p.includes(d.id));
  S.grave.unshift({ name: d.name, reg: d.reg, day: S.day, cause, level: d.level, gen: d.gen });
}

// ---------- Slekt og avl ----------
function parentsOf(id) { const r = S.reg[id]; return r ? [r.mom, r.dad].filter(Boolean) : []; }
function relation(a, b) {
  const pa = parentsOf(a), pb = parentsOf(b);
  if (pa.includes(b) || pb.includes(a)) return 'naer';
  if (pa.some(x => pb.includes(x))) return 'naer';
  const ga = pa.flatMap(parentsOf), gb = pb.flatMap(parentsOf);
  if (ga.includes(b) || gb.includes(a)) return 'fjern';
  if (ga.some(x => gb.includes(x))) return 'fjern';
  if (pa.some(x => gb.includes(x)) || pb.some(x => ga.includes(x))) return 'fjern';
  return 'ingen';
}
const REL_TXT = { naer: 'Nær slekt: stor risiko for defekter', fjern: 'Fjern slekt: litt risiko for defekter', ingen: 'Ikke i slekt' };

function makePuppy(mom, dad) {
  const rel = relation(mom.id, dad.id);
  const risk = rel === 'naer' ? 0.55 : rel === 'fjern' ? 0.2 : 0;
  const id = newId(); const n = S.nextId - 1;
  const sex = chance(0.5) ? 'M' : 'F';
  const stats = {};
  for (const k of STATS) {
    const hi = Math.max(mom.stats[k], dad.stats[k]), lo = Math.min(mom.stats[k], dad.stats[k]);
    const v = chance(0.6) ? hi : lo;
    let drift = 0;
    if (chance(0.15)) drift = chance(0.5) ? 1 : -1;
    if (risk && chance(risk * 0.5)) drift = -1;
    stats[k] = clamp(v + drift, 1, 10);
  }
  const pool = [...new Set([...mom.learned, ...dad.learned])];
  const learned = [];
  if (pool.length && chance(0.7)) {
    learned.push(pool.splice(Math.floor(rnd() * pool.length), 1)[0]);
    if (pool.length && chance(0.25)) learned.push(pool.splice(Math.floor(rnd() * pool.length), 1)[0]);
  }
  let muts = [];
  for (const m of new Set([...mom.muts, ...dad.muts])) if (chance(0.5)) muts.push(m);
  let defect = null;
  if (risk && chance(risk)) { defect = randomMut(0, muts); if (defect) muts.push(defect); }
  if (chance(0.10)) { const m = randomMut(0.65, muts); if (m) muts.push(m); }
  if (muts.length > 3) muts = (defect ? [defect, ...shuffle(muts.filter(m => m !== defect))] : shuffle(muts)).slice(0, 3);
  const look = {};
  for (const g of ['fur', 'patc', 'pat', 'ears', 'snout', 'eye']) look[g] = chance(0.5) ? mom.look[g] : dad.look[g];
  if (chance(0.08)) look.fur = ri(0, FURS.length - 1);
  if (chance(0.08)) look.pat = pick(PATTERNS);
  if (chance(0.06)) look.ears = pick(EARS);
  return {
    id, reg: regNo(n, S.day + 1), name: freshName(sex), sex, stats, look, muts, learned,
    level: 1, xp: 0, status: 'valp', bornDay: S.day + 1, mom: mom.id, dad: dad.id,
    gen: Math.max(mom.gen, dad.gen) + 1, kurs: false, scars: 0, runs: 0, wins: 0, rel, defect,
  };
}
function litterSize() { const r = rnd(); return r < 0.45 ? 1 : r < 0.85 ? 2 : 3; }
const canBreed = d => d && (d.status === 'voksen' || d.status === 'veteran');
function pairedWith(id) { const p = S.pairs.find(p => p.includes(id)); return p ? (p[0] === id ? p[1] : p[0]) : null; }
function pairProblem(a, b) {
  if (!a || !b) return 'Finnes ikke';
  if (a.id === b.id) return 'Samme hund';
  if (!canBreed(b)) return b.status === 'valp' ? 'Er valp til i morgen' : 'Kan ikke pare seg';
  if (a.sex === b.sex) return 'Samme kjønn';
  if (pairedWith(b.id)) return 'Allerede paret';
  return null;
}

// Natten: valper vokser opp, parede hunder får valper, dagen går.
function nightFall() {
  const news = [];
  for (const d of S.dogs) if (d.status === 'valp') { d.status = 'voksen'; news.push(`${d.name} er blitt voksen og klar for tur.`); }
  for (const [a, b] of S.pairs) {
    const A = dogById(a), Bd = dogById(b);
    if (!A || !Bd) continue;
    const mom = A.sex === 'F' ? A : Bd, dad = A.sex === 'F' ? Bd : A;
    const free = CAP - S.dogs.length;
    if (free <= 0) { news.push(`Det var ikke plass til valpene til ${mom.name} og ${dad.name}.`); continue; }
    const n = Math.min(free, litterSize());
    const pups = [];
    for (let i = 0; i < n; i++) pups.push(addDog(makePuppy(mom, dad)));
    let line = `${mom.name} og ${dad.name} fikk ${n === 1 ? 'én valp' : n + ' valper'}: ${pups.map(p => p.name).join(', ')}.`;
    const def = pups.filter(p => p.defect);
    if (def.length) line += ` Innavl: ${def.map(p => `${p.name} fikk ${MUTS[p.defect].name.toLowerCase()}`).join(', ')}.`;
    news.push(line);
  }
  S.pairs = [];
  S.day++;
  if (!S.dogs.some(d => d.status === 'voksen' || d.status === 'valp') && S.dogs.length < CAP) {
    const s = addDog(makeStray());
    news.push(`En gatehund, ${s.name}, sto og ventet ved porten i morges.`);
  }
  S.news = news.length ? news : ['En rolig natt. Ingen nye valper.'];
}

let svgN = 0;
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const t = amt < 0 ? 0 : 255, p = Math.abs(amt);
  r = Math.round((t - r) * p + r); g = Math.round((t - g) * p + g); b = Math.round((t - b) * p + b);
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}
const INK = '#24180d';
function eyeSVG(cx, cy, r, c, off) {
  return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff" stroke-width="2"/>` +
    `<circle cx="${cx + off}" cy="${cy + 0.6}" r="${(r * 0.62).toFixed(2)}" fill="${c}" stroke="none"/>` +
    `<circle cx="${cx + off}" cy="${cy + 0.6}" r="${(r * 0.3).toFixed(2)}" fill="${INK}" stroke="none"/>` +
    `<circle cx="${(cx + off - r * 0.22).toFixed(2)}" cy="${(cy - r * 0.15).toFixed(2)}" r="${(r * 0.15).toFixed(2)}" fill="#fff" stroke="none"/>`;
}
function dogSVG(d, o = {}) {

  const pup = d.status === 'valp';
  const sc = (M.has('kjempehode') ? 1.1 : 1) * (pup ? 0.86 : 1);
  const one = M.has('ettore');
  const ears = M.has('flaksorer') ? 'vinge' : L.ears;
  let s = `<svg class="portrait" viewBox="0 0 100 100" aria-hidden="true"><defs><clipPath id="${id}"><ellipse cx="50" cy="54" rx="31" ry="28"/></clipPath></defs>`;
  s += `<g transform="translate(50 ${pup ? 58 : 54}) scale(${sc}) translate(-50 -54)" stroke="${INK}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">`;
  if (ears === 'spiss') {
    s += `<path d="M24 44 L25 12 L45 30 Z" fill="${earC}"/><path d="M29 36 L29.5 21 L39 30 Z" fill="#e7a3a0" stroke="none"/>`;
    if (!one) s += `<path d="M76 44 L75 12 L55 30 Z" fill="${earC}"/><path d="M71 36 L70.5 21 L61 30 Z" fill="#e7a3a0" stroke="none"/>`;
  }
  if (ears === 'rund') { s += `<circle cx="27" cy="30" r="12" fill="${earC}"/>`; if (!one) s += `<circle cx="73" cy="30" r="12" fill="${earC}"/>`; }
  if (ears === 'vinge') {
    s += `<path d="M27 42 Q4 34 5 12 Q13 22 20 20 Q13 28 22 30 Q16 36 31 38 Z" fill="#f6f2ea"/>`;
    if (!one) s += `<path d="M73 42 Q96 34 95 12 Q87 22 80 20 Q87 28 78 30 Q84 36 69 38 Z" fill="#f6f2ea"/>`;
  }
  if (M.has('horn')) s += `<path d="M37 30 Q30 14 38 7 Q37 19 45 27 Z" fill="#efe3c8"/><path d="M63 30 Q70 14 62 7 Q63 19 55 27 Z" fill="#efe3c8"/>`;
  if (M.has('pigg')) s += `<path d="M27 38 L29 21 L36 30 L41 14 L47 27 L53 12 L58 27 L65 16 L69 32 Z" fill="${shade(fur2, -0.1)}"/>`;
  s += `<ellipse cx="50" cy="54" rx="31" ry="28" fill="${fur}"/>`;
  const pats = {
    flekker: '<circle cx="34" cy="40" r="6"/><circle cx="66" cy="63" r="7"/><circle cx="60" cy="34" r="4"/><circle cx="27" cy="64" r="4.5"/>',
    maske: '<ellipse cx="50" cy="47" rx="27" ry="10"/>',
    lapp: '<circle cx="63" cy="46" r="11"/>',
    blis: '<path d="M45 24 h10 l-1.5 32 h-7 Z"/>',
  };
  if (pats[L.pat]) s += `<g clip-path="url(#${id})" fill="${L.pat === 'blis' ? muz : fur2}" stroke="none">${pats[L.pat]}</g>`;
  s += `<ellipse cx="50" cy="54" rx="31" ry="28" fill="none"/>`;
  if (hairless) s += `<path d="M38 32 q12 -5 24 0 M41 37 q9 -4 18 0" fill="none" stroke-width="1.6"/>`;

function strike(B, src, tgt, base, o = {}) {
  if (!tgt || tgt.dead || tgt.down) return false;
  if (!o.magic && chance(tgt.dodge || 0)) { say(B, `${tgt.name} unnviker ${src.name}.`); fx(B, 'miss', tgt, 0); return false; }
  let dmg = base, crit = false;
  if (chance(src.crit || 0)) { dmg *= 2; crit = true; }
  say(B, `${src.name} treffer ${tgt.name} for ${dmg}${crit ? ' (kritisk!)' : ''}.`);
  hurt(B, tgt, dmg, crit);
  if (o.melee && tgt.thorns && !src.dead && !src.down) { say(B, `Au! ${src.name} stikker seg på pigghåret.`); hurt(B, src, tgt.thorns, false); }
  if (o.poison && !tgt.dead && !tgt.down) tgt.poison = 3;

}
function hurt(B, tgt, dmg, crit) {
  if (tgt.dead || tgt.down) return;
  if (tgt.shield > 0) { const a = Math.min(tgt.shield, dmg); tgt.shield -= a; dmg -= a; }
  tgt.hp = Math.max(0, tgt.hp - dmg);
  fx(B, crit ? 'crit' : 'dmg', tgt, dmg);
  if (tgt.hp <= 0) {
    if (tgt.side === 'dog') { tgt.down = true; tgt.poison = 0; tgt.taunt = false; tgt.shield = 0; tgt.acted = true; say(B, `${tgt.name} ligger nede!`); }
    else { tgt.dead = true; say(B, `${tgt.name} er beseiret.`); }
  }
  checkOver(B);
}

  const before = t.hp;
  t.hp = Math.min(t.maxHp, t.hp + amt);
  if (t.down && t.hp > 0) { t.down = false; t.moved = true; t.acted = true; say(B, `${t.name} reiser seg igjen!`); }
  fx(B, 'heal', t, t.hp - before);
}
function push(B, src, tgt) {
  if (tgt.dead || tgt.down) return;
  if (tgt.boss) { say(B, `${tgt.name} rikker seg ikke.`); return; }
  let dx = Math.sign(tgt.x - src.x), dy = Math.sign(tgt.y - src.y);
  if (dx && dy) { if (Math.abs(tgt.x - src.x) >= Math.abs(tgt.y - src.y)) dy = 0; else dx = 0; }
  if (!dx && !dy) return;
  const nx = tgt.x + dx, ny = tgt.y + dy;
  if (isFree(B, nx, ny)) { tgt.x = nx; tgt.y = ny; }
  else { say(B, `${tgt.name} smeller inn i noe.`); hurt(B, tgt, 1, false); }
}
function checkOver(B) {
  if (B.over) return;
  if (!B.units.some(u => u.side === 'enemy' && !u.dead)) B.over = 'win';
  else if (!B.units.some(u => u.side === 'dog' && !u.down && !u.dead)) B.over = 'loss';
}

// Bevegelse: bredde-først-søk. Egne enheter kan passeres, fiender ikke. Flygere går over alt.
function reach(B, u) {
  const map = new Map(), ends = new Map();
  map.set(u.x + ',' + u.y, { d: 0, prev: null });
  const q = [[u.x, u.y]];
  while (q.length) {
    const [x, y] = q.shift(); const d = map.get(x + ',' + y).d;
    if (d >= u.move) continue;
    for (const [dx, dy] of DIRS) {
      const nx = x + dx, ny = y + dy; if (!inB(B, nx, ny)) continue;
      const k = nx + ',' + ny; if (map.has(k)) continue;
      const t = tileAt(B, nx, ny), o = unitAt(B, nx, ny);
      if (!u.fly && t !== 0) continue;
      if (!u.fly && o && o.side !== u.side && !o.down) continue; // nede hunder kan man gå over, men ikke stå på
      map.set(k, { d: d + 1, prev: x + ',' + y }); q.push([nx, ny]);
      if (t === 0 && !o) ends.set(k, d + 1);

  }

function pathTo(map, x, y) {
  const out = []; let k = x + ',' + y;
  while (k) { const n = map.get(k); if (!n || n.prev === null) break; out.push(k.split(',').map(Number)); k = n.prev; }
  return out.reverse();

// Avstandskart fra målene, uten å ta hensyn til enheter (de flytter seg uansett).
function distField(B, targets, fly) {
  const f = new Array(B.w * B.h).fill(-1); const q = [];
  for (const t of targets) { f[t.y * B.w + t.x] = 0; q.push([t.x, t.y]); }
  while (q.length) {
    const [x, y] = q.shift(); const d = f[y * B.w + x];
    for (const [dx, dy] of DIRS) {
      const nx = x + dx, ny = y + dy; if (!inB(B, nx, ny)) continue;
      const i = ny * B.w + nx; if (f[i] >= 0) continue;
      if (!fly && B.tiles[i] !== 0) continue;
      f[i] = d + 1; q.push([nx, ny]);
    }

function makeDogUnit(B, pm, x, y) {

function planEnemy(B, e) {
  const dogs = B.units.filter(u => u.side === 'dog' && !u.down && !u.dead);
  if (!dogs.length) return { path: [], target: null };
  const R = reach(B, e);
  const spots = [[e.x, e.y, 0], ...[...R.ends].map(([k, d]) => [...k.split(',').map(Number), d])];
  const taunters = dogs.filter(d => d.taunt && man(e.x, e.y, d.x, d.y) <= e.move + e.range[1] + 2);
  const pool = taunters.length ? taunters : dogs;
  let best = null;
  for (const [x, y, steps] of spots) {
    for (const d of pool) {
      const dist = man(x, y, d.x, d.y);
      if (dist < e.range[0] || dist > e.range[1]) continue;
      const score = -d.hp * 2 + (e.range[1] > 1 ? dist * 3 : 0) - steps * 0.1 + rnd() * 0.5;
      if (!best || score > best.score) best = { score, x, y, target: d };
    }
  }
  if (best) return { path: pathTo(R.map, best.x, best.y), target: best.target };
  const field = distField(B, pool, e.fly);
  let bt = null;
  for (const [x, y, steps] of spots) {
    const f = field[y * B.w + x]; const v = f < 0 ? 999 : f;
    if (!bt || v < bt.v || (v === bt.v && steps < bt.steps)) bt = { v, x, y, steps };
  }
  return { path: bt ? pathTo(R.map, bt.x, bt.y) : [], target: null };
}

  for (const [x, y] of path) { u.x = x; u.y = y; render(); await wait(85); }
}
async function enemyAct(B, e) {
  if (e.boss && B.round % 3 === 0) {
    const n = B.units.filter(o => o.side === 'enemy' && !o.dead).length;
    if (n < 7) {
      const spots = shuffle(freeTiles(B).filter(([x]) => x >= 5)).slice(0, 2);
      for (const [x, y] of spots) { const c = makeEnemy(B, 'katt', x, y, B.scale); c.acted = true; B.units.push(c); }
      if (spots.length) { say(B, 'Kattekongen roper på hjelp! Nye katter dukker opp.'); render(); await wait(400); return; }
    }
  }
  const plan = planEnemy(B, e);
  if (plan.path.length) await animatePath(B, e, plan.path);
  if (plan.target && !plan.target.down && !e.dead) {
    await wait(120);
    strike(B, e, plan.target, e.dmg, { melee: e.range[1] === 1, poison: e.poisonAtk });

  }
}
async function enemyPhase(B) {
  B.phase = 'enemy'; UI.busy = true; render(); save();
  if (!B.ticked) {
    B.ticked = true;
    for (const e of B.units.filter(o => o.side === 'enemy' && !o.dead)) {
      if (e.poison > 0) { e.poison--; say(B, `${e.name} klør seg (lopper).`); hurt(B, e, 1, false); }
      if (!e.dead && nearPoop(B, e)) { say(B, `${e.name} kveles av bæsjestank.`); hurt(B, e, 1, false); }

function actionDamage(u, id) {
  return { bitt: u.melee, nafs: Math.max(1, u.melee - 1), pinne: u.ranged, gnist: u.magic, storm: u.melee + 2, apport: u.ranged + 1, glefs: 2 * Math.max(1, u.melee - 1) }[id] || 0;

function scoreAction(B, u, id, t) {
  const tu = unitAt(B, t.x, t.y);

  switch (id) {

    case 'rull': return (u.maxHp - u.hp) >= 5 ? 6 : 0;

    case 'grav': return 0;
    case 'baesj': return foesOf(B, u).some(e => man(e.x, e.y, t.x, t.y) <= 1) ? 2.5 : 0;
    case 'loppe': return tu && !tu.poison ? Math.min(3, tu.hp) : 0;

}
function autoDog(B, u) {
  const R = reach(B, u);

  const spots = [[ox, oy], ...[...R.ends.keys()].map(k => k.split(',').map(Number))];
  let best = null;

}

function rollNode(step, avoid) {
  const w = [['kamp', 40], ['hendelse', 25], ['hvil', step >= 2 ? 15 : 8], ['elite', step >= 2 ? 20 : 0]];
  for (let tries = 0; tries < 20; tries++) {
    let r = rnd() * w.reduce((s, x) => s + x[1], 0), t = 'kamp';
    for (const [k, v] of w) { if (r < v) { t = k; break; } r -= v; }

}

  steps.push([{ t: 'kamp', place: a }, { t: 'kamp', place: b }]);

  const party = team.map(t => { const d = dogById(t.dogId); return { dogId: d.id, cls: t.cls, hp: derive(d, t.cls).maxHp, dead: false, name: d.name }; });

// ---------- Kennel-handlinger ----------
function adopt() {
  if (S.bones < ADOPT_COST || S.dogs.length >= CAP) return null;
  S.bones -= ADOPT_COST; return addDog(makeStray());
}
function addPair(aId, bId) {
  const a = dogById(aId), b = dogById(bId);
  if (!a || !canBreed(a) || pairedWith(aId) || pairProblem(a, b)) return false;
  S.pairs.push([aId, bId]); return true;
}
function puppyCourse(id) {
  const d = dogById(id); if (!d || d.status !== 'valp' || d.kurs || S.bones < KURS_COST) return null;
  const ks = STATS.filter(k => d.stats[k] < 10); if (!ks.length) return null;
  S.bones -= KURS_COST; d.kurs = true; const k = pick(ks); d.stats[k]++; return k;
}
function giveAway(id) {
  const d = dogById(id); if (!d) return;
  S.dogs = S.dogs.filter(x => x.id !== id); S.pairs = S.pairs.filter(p => !p.includes(id)); S.bones += GIVE_BONES;
}

// ---------- Autospill av en hel tur (tester) ----------
function autoTeam() {
  return shuffle(S.dogs.filter(d => d.status === 'voksen')).slice(0, 4).map(d => ({ dogId: d.id, cls: null }));
}
async function autoRun(team) {
  if (!startRun(team || autoTeam())) return null;
  for (let guard = 0; guard < 300 && S.run; guard++) {
    const run = S.run;
    if (run.screen === 'map') {
      const opts = run.nodes[run.step];
      const hurtAvg = alive().reduce((s, pm) => s + pm.hp / maxHpOf(pm), 0) / Math.max(1, alive().length);
      let i = Math.floor(rnd() * opts.length);
      const rest = opts.findIndex(o => o.t === 'hvil'); if (rest >= 0 && hurtAvg < 0.6) i = rest;
      chooseNode(i);
    } else if (run.screen === 'battle') {
      if (!run.battle.over) await simBattle(run.battle);
      if (!run.battle.over) run.battle.over = 'loss';
      finishBattle(); continueAfterBattle();
    } else if (run.screen === 'event') {
      if (!run.event.result) { const ev = EVENTS.find(e => e.id === run.event.id); const ok = ev.opts.map((o, j) => j).filter(j => !ev.opts[j].need || ev.opts[j].need()); chooseEvent(pick(ok)); }
      else continueEvent();
    } else if (run.screen === 'levelup') chooseOffer(Math.floor(rnd() * run.levelQueue[0].offers.length));
    else if (run.screen === 'end') { const res = run.result; closeRun(); return res; }
  }
  return { kind: 'stuck' };
}

const SEX = { M: '♂', F: '♀' };
const STATUS_TXT = { voksen: 'Klar for tur', valp: 'Valp', veteran: 'Veteran' };
const STATUS_CLS = { voksen: 'klar', valp: 'valp', veteran: 'veteran' };

function topBar(narrow) {
  return `<header class="top${narrow ? ' narrow' : ''}"><div><div class="logo">Voffgenics</div><div class="tagline">Avl, mutasjoner og bakgårdskrig mot kattene</div></div>
  <div class="meters"><span class="meter">Dag ${S.day}</span><span class="meter">${S.bones} bein</span><span class="meter">Kongen slått: ${S.wins}</span></div></header>`;
}
function infoChip(cls, name, text) { return `<button class="chip ${cls}" data-act="info" data-text="${esc(name + ': ' + text)}">${esc(name)}</button>`; }
function statRows(d) {
  return STATS.map(k => {
    const base = d.stats[k], e = eff(d, k);
    let pips = '';
    for (let i = 1; i <= 10; i++) {
      let c = '';
      if (i <= Math.min(base, e)) c = 'on';
      else if (i <= e) c = 'plus';
      else if (i <= base) c = 'minus';
      pips += `<i class="${c}"></i>`;
    }
    return `<div class="stat" title="${STAT_NAME[k]}: ${STAT_HELP[k]}"><span>${STAT_ABBR[k]}</span><span class="pips">${pips}</span><span class="v">${e}</span></div>`;
  }).join('');
}
function chipsFor(d) {
  const m = d.muts.map(id => infoChip(MUTS[id].bad ? 'mut bad' : 'mut', MUTS[id].name, MUTS[id].desc));
  const a = d.learned.map(id => infoChip('abil', abil(id).name, abil(id).desc));
  return m.concat(a).join('') || '<span class="muted" style="font-size:12.5px">Ingen evner eller mutasjoner ennå</span>';
}
function lineage(d) {
  if (!d.mom && !d.dad) return 'Gatehund, ukjente foreldre';
  const n = id => (S.reg[id] && S.reg[id].name) || 'ukjent';
  return `Mor: ${esc(n(d.mom))} · Far: ${esc(n(d.dad))} · Gen. ${d.gen}`;
}
function dogCard(d) {
  const D = derive(d);
  let cls = `dog ${d.status}`, actions = '';
  if (UI.pairing) {
    const a = dogById(UI.pairing);
    if (d.id === UI.pairing) actions = `<button class="btn ghost small" data-act="cancel-pair">Avbryt</button>`;
    else {
      const prob = pairProblem(a, d);
      if (prob) { cls += ' dim'; actions = `<span class="muted" style="font-size:12.5px">${prob}</span>`; }
      else {
        const rel = relation(a.id, d.id); cls += ' cand';
        actions = `<button class="btn small go" data-act="pair-with" data-id="${d.id}">Par med ${esc(a.name)}</button><span class="warnline ${rel}">${REL_TXT[rel]}</span>`;
      }
    }
  } else {
    const p = pairedWith(d.id);
    if (p) actions += `<span class="warnline">Paret med ${esc(dogById(p).name)} i natt</span>`;
    else if (canBreed(d)) actions += `<button class="btn small" data-act="pair" data-id="${d.id}">Finn partner</button>`;
    if (d.status === 'valp' && !d.kurs) actions += `<button class="btn small ghost" data-act="kurs" data-id="${d.id}" ${S.bones >= KURS_COST ? '' : 'disabled'}>Valpekurs · ${KURS_COST} bein</button>`;
    actions += `<button class="btn small ghost" data-act="give" data-id="${d.id}">Gi bort</button>`;
  }
  return `<article class="${cls}" data-dog="${d.id}">
    <div class="dog-head"><div class="pic">${dogSVG(d)}</div>
      <div class="id"><h3>${esc(d.name)} <span class="sex">${SEX[d.sex]}</span></h3><div class="reg">${d.reg}</div>
      <div class="row" style="gap:5px"><span class="pill ${STATUS_CLS[d.status]}">${STATUS_TXT[d.status]}</span><span class="pill">Nivå ${d.level}</span>${d.scars ? `<span class="pill">${d.scars} arr</span>` : ''}</div></div></div>
    <div class="stats">${statRows(d)}</div>
    <div class="derived">Helse ${D.maxHp} · Går ${D.move} · Bitt ${D.melee}</div>
    <div class="chips">${chipsFor(d)}</div>
    <div class="lineage">${lineage(d)}</div>
    <div class="card-actions">${actions}</div>
  </article>`;
}

    updateBattle();
  } else {
    let html;
    if (S.screen === 'setup') html = viewSetup();
    else if (S.screen === 'run' && S.run) html = { map: viewMap, event: viewEvent, levelup: viewLevel, end: viewEnd }[S.run.screen]();
    else html = viewKennel();
    const key = S.screen + ':' + (S.run ? S.run.screen + S.run.step : '');
    app.innerHTML = html;
    if (app.dataset.key !== key) { app.dataset.key = key; window.scrollTo(0, 0); }
  }
  $('#modal-root').innerHTML = UI.confirm ? `<div class="overlay"><div class="modal" role="dialog" aria-modal="true"><h2>${esc(UI.confirm.title)}</h2><p>${esc(UI.confirm.text)}</p>

}
function toast(txt) {

  clearTimeout(UI.toastTimer); UI.toastTimer = setTimeout(() => { el.hidden = true; }, 3800);

// ---------- Kampinput ----------
function autoSelect() {
  const B = S.run && S.run.battle; if (!B) return;
  const d = B.units.find(u => u.side === 'dog' && !u.down && !u.acted);
  UI.sel = d ? d.id : null; UI.mode = 'move';
}
const canClick = B => B && !B.over && B.phase === 'player' && !UI.busy;
async function onTile(x, y) {
  const B = S.run && S.run.battle; if (!canClick(B)) return;
  const sel = selUnit(B), u = unitAt(B, x, y);
  if (sel && UI.mode.startsWith('act:')) {
    const id = UI.mode.slice(4);
    const usable = !sel.acted && sel.actions.includes(id) && !(sel.cds[id] > 0);
    if (usable && ACTIONS[id].targets(B, sel).some(t => t.x === x && t.y === y)) return playerAction(sel, id, x, y);
    UI.mode = 'move';
    if (!u) return;
  }
  if (u && u.side === 'dog' && !u.down) { UI.sel = u.id; UI.mode = 'move'; return; }
  if (sel && !sel.acted) {
    if (!sel.moved && !u) {
      const R = reach(B, sel);
      if (R.ends.has(x + ',' + y)) {
        sel.from = { x: sel.x, y: sel.y }; sel.moved = true; UI.busy = true;
        await animatePath(B, sel, pathTo(R.map, x, y));
        UI.busy = false; return;
      }
    }
    if (u && u.side === 'enemy') {
      const atk = sel.actions[0];
      if (!(sel.cds[atk] > 0) && ACTIONS[atk].targets(B, sel).some(t => t.x === x && t.y === y)) return playerAction(sel, atk, x, y);
    }
  }
  if (u) { UI.info = u.id; return; }
  UI.info = null;
}
async function playerAction(u, id, x, y) {
  const B = S.run.battle;
  execAction(B, u, id, x, y);
  UI.mode = 'move';
  await afterDogDone(B);
}
async function afterDogDone(B) {
  render();
  if (B.over) { finishBattle(); return; }
  UI.mode = 'move';
  const next = B.units.find(o => o.side === 'dog' && !o.down && !o.acted);
  if (next) { UI.sel = next.id; return; }
  UI.busy = true; render(); await wait(350); UI.busy = false;
  await endTurn();
}
function onAction(id) {
  const B = S.run && S.run.battle, u = selUnit(B);
  if (!canClick(B) || !u || u.acted) return;
  const A = ACTIONS[id]; if (!A || !u.actions.includes(id) || (u.cds[id] || 0) > 0) return;
  if (UI.mode === 'act:' + id) { UI.mode = 'move'; return; }

}

  const B = S.run && S.run.battle;
  if (!B || B.over || B.phase !== 'player' || UI.busy) return;
  UI.sel = null; UI.mode = 'move'; UI.info = null;

  'event-opt'(ds) { chooseEvent(+ds.i); },

  'close-run'() { closeRun(); },
  tile(ds) { return onTile(+ds.x, +ds.y); },

  'sel-dog'(ds) { UI.sel = ds.id; UI.mode = 'move'; },

  undo() {
    const B = S.run && S.run.battle, u = selUnit(B);
    if (canClick(B) && u && u.from && u.moved && !u.acted && isFree(B, u.from.x, u.from.y)) { u.x = u.from.x; u.y = u.from.y; u.from = null; u.moved = false; }

let pending = Promise.resolve();
function dispatch(act, ds = {}) {
  const h = H[act]; if (!h) return pending;
  const r = h(ds);
  render();
  if (r && r.then) pending = r.then(() => render());
  return pending;
}

// ---------- Lagring ----------
let lastSave = null;
function save() {
  if (HEADLESS) return;
  lastSave = JSON.stringify({ S, rng: rngState });
  try { localStorage.setItem(SAVE_KEY, lastSave); } catch (e) { /* lagring er valgfri */ }
}
function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY); if (!raw) return false;
    const o = JSON.parse(raw); if (!o || !o.S || o.S.v !== 1) return false;
    S = o.S; rngState = (o.rng >>> 0) || 1; return true;
  } catch (e) { return false; }
}
function resume() {
  const B = S.run && S.run.battle; if (!B) return;
  UI.busy = false;
  if (B.over) { finishBattle(); render(); return; }
  if (B.phase === 'enemy') enemyPhase(B).then(() => { if (B.over) finishBattle(); else autoSelect(); render(); });
  else autoSelect();
}

// ---------- Oppstart ----------
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled || e.detail > 1) return; // andre klikk i et dobbeltklikk skal ikke treffe neste hunds knapp
  dispatch(el.dataset.act, { ...el.dataset });
});
document.addEventListener('mouseover', e => {
  const el = e.target.closest('.tile'); const B = S && S.run && S.run.battle;
  if (!el || !B || !UI.mode.startsWith('act:')) return;
  UI.hover = { x: +el.dataset.x, y: +el.dataset.y }; refreshTiles(B);
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (UI.confirm) UI.confirm = null; else if (UI.pairing) UI.pairing = null; else if (UI.mode !== 'move') UI.mode = 'move'; else return;
  render();
});
function start(data) {
  if (data && data.S && data.S.v === 1) { S = data.S; rngState = (data.rng >>> 0) || 1; }
  else if (!load()) newGame();
  render();
  try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => (lastSave ? JSON.parse(lastSave) : { S, rng: rngState })); } catch (e) { /* ikke i en visning */ }
  resume();
  render();
}

// Test-API: lar Playwright kjøre de samme funksjonene som knappene bruker.
window.VOFF = {
  get S() { return S; }, set S(v) { S = v; }, UI,
  seed, rnd, newGame, makePuppy, makeStray, addDog, relation, derive, eff, dogById,
  makeBattle, simBattle, battleProblems, autoRun, startRun, chooseNode, finishBattle, continueAfterBattle,
  nightFall, addPair, dispatch, render, MUTS, STATS, LEARNED,
  idle: () => pending,
  headless(v) { HEADLESS = !!v; },
  speed(v) { SPEED = v; },
};

const hot = window.claude && window.claude.hot;
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});

})();
</script>
